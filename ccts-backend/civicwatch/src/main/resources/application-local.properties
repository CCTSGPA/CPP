# Local Development Profile
# Database Configuration for Local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/corruption_db?createDatabaseIfNotExist=false&useSSL=false&requireSSL=false&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Dhruv@07
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JWT Configuration
jwt.secret=your_jwt_secret_key_here_change_in_production_12345678901234567890
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# OAuth2 Configuration (optional - fill in your credentials)
oauth2.google.client-id=your_google_client_id
oauth2.google.client-secret=your_google_client_secret
oauth2.google.redirect-uri=http://localhost:3000/auth/google/callback

oauth2.facebook.client-id=your_facebook_app_id
oauth2.facebook.client-secret=your_facebook_app_secret
oauth2.facebook.redirect-uri=http://localhost:3000/auth/facebook/callback

# Notification Settings
notification.enabled=true
notification.admin-email=admin@civicwatch.com
notification.admin-phone=+1234567890
notification.send-on-complaint-submit=true
notification.send-on-status-update=true
notification.send-on-assignment=true

# Logging
logging.level.root=INFO
logging.level.com.ccts=DEBUG
logging.level.org.springframework.web=DEBUG
